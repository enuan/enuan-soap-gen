name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Install soap CLI
        run: |
          go install github.com/enuan/soap-go/cmd/soap@v0.29.2-enuan.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: E2E
        run: make e2e SOAP_BIN="$(go env GOPATH)/bin/soap"
